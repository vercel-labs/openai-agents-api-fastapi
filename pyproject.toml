[project]
name = "sandboxed-repo-agent"
version = "1.0.0"
description = "FastAPI demo for the OpenAI Agents API public beta with Vercel Sandbox"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai==3.37.0",
    "anyio==4.15.1",
    "fastapi==0.162.0",
    "python-dotenv==1.2.4",
    "uvicorn==0.54.0",
    "vercel==0.12.1",
]

[project.optional-dependencies]
dev = [
    "httpx2==2.16.0",
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sandbox_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.exclude-newer-package]
# Permit the reviewed upgrades and their matching SDK components under local age limits.
openai = "2026-10-24T00:00:00Z"
fastapi = "2026-10-24T00:00:00Z"
vercel = "2026-10-24T00:00:00Z"
vercel-queue = "2026-10-24T00:00:00Z"
vercel-sandbox = "2026-10-24T00:00:00Z"
vercel-workflow = "2026-10-24T00:00:00Z"
ruff = "2026-10-24T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
